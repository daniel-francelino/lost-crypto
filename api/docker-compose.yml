services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lostcrypto
      POSTGRES_PASSWORD: lostcrypto
      POSTGRES_DB: lostcrypto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostcrypto -d lostcrypto"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment: &app-env
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+asyncpg://lostcrypto:lostcrypto@postgres:5432/lostcrypto
      # Secrets come from your shell / an .env next to this file; empty means unset.
      API_TOKEN: ${API_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      CREDENTIAL_MASTER_KEYS: ${CREDENTIAL_MASTER_KEYS:-}
      TESTNET_TRADING_ENABLED: ${TESTNET_TRADING_ENABLED:-false}
      # LIVE TRADING (real money): off unless you set every one of these on purpose.
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      LIVE_MAX_ORDER_NOTIONAL: ${LIVE_MAX_ORDER_NOTIONAL:-}
      LIVE_MAX_TOTAL_EXPOSURE: ${LIVE_MAX_TOTAL_EXPOSURE:-}
      LIVE_MAX_DAILY_LOSS: ${LIVE_MAX_DAILY_LOSS:-}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      # LIVE_TRADING_ENABLED is intentionally not defined here (defaults to false).
    ports:
      - "8000:8000"
    volumes:
      - backups:/backups  # `docker compose exec api python -m manage backup`
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    command: ["python", "-m", "worker"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    # Unhealthy when the worker's heartbeat in the database is older than
    # WORKER_STALE_AFTER_SECONDS. For a whole-host outage point an external monitor at
    # GET /api/v1/health/worker (see docs/operations/runbook.md).
    healthcheck:
      test: ["CMD", "python", "-m", "worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  backups:
